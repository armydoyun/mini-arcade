name: ci

# 모든 브랜치의 push와 PR마다 실행한다. Actions 탭의 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
#   lint   ESLint(경고도 실패) + 실행 원본 용량 상한(1,000,000 B)
#   test   node: 모의 DOM으로 40종 실제 모듈·규칙·완주·빌드 검사 / browser: Chromium에서 개발 소스·배포본 실제 실행
#   build  lint·test가 모두 통과하면 한 파일짜리 배포본(deploy/index.html)을 Artifacts에 올린다
#   deploy main에 push되고 저장소 변수 DEPLOY_PAGES가 true이면 같은 배포본을 GitHub Pages에 올린다
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install lint tools
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check runtime size
        run: npm run size:check

  # 두 묶음을 따로 돌린다. 어느 묶음이 실패했는지 작업 이름에서 바로 보이고, 하나가 실패해도 나머지는 끝까지 돈다.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [node, browser]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm tools
        run: npm ci --no-audit --no-fund

      # Chromium 내려받기는 Playwright 버전(lock 파일)이 같으면 캐시에서 꺼낸다. 시스템 라이브러리는 매번 설치한다.
      - name: Cache Playwright browsers
        if: matrix.suite == 'browser'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: matrix.suite == 'browser'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # --strict: 준비되지 않아 건너뛴 묶음(SKIP)도 실패로 친다.
      - name: Run ${{ matrix.suite }} tests
        run: node tests/run.mjs ${{ matrix.suite }} --strict

      - name: Upload browser screenshots
        if: always() && matrix.suite == 'browser'
        uses: actions/upload-artifact@v6
        with:
          name: mini-arcade-screenshots-${{ github.sha }}
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build single-file deploy
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: mini-arcade-deploy-${{ github.sha }}
          path: deploy/index.html
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy/

  # 켜는 법: Settings → Pages → Source를 "GitHub Actions"로 바꾸고, Settings → Secrets and variables → Actions → Variables에 DEPLOY_PAGES=true
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
